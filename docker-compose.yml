# Local development infrastructure.
# For now only the database runs here; the backend, frontend and message broker
# are added as separate services in later stages.
services:
  postgres:
    image: postgres:17-alpine
    container_name: quizzy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizzy}
      POSTGRES_DB: ${POSTGRES_DB:-quizzy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizzy} -d ${POSTGRES_DB:-quizzy}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
