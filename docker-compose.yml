# Full application stack: database, message broker, API and web client.
# Run `docker compose up --build` and open the web client on http://localhost:8080.
services:
  postgres:
    image: postgres:17-alpine
    container_name: quizzy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizzy}
      POSTGRES_DB: ${POSTGRES_DB:-quizzy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizzy} -d ${POSTGRES_DB:-quizzy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: quizzy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quizzy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quizzy}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Quizzy.Api/Dockerfile
    container_name: quizzy-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-quizzy};Username=${POSTGRES_USER:-quizzy};Password=${POSTGRES_PASSWORD:-quizzy}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-quizzy}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-quizzy}
      Jwt__SigningKey: ${Jwt__SigningKey:?set Jwt__SigningKey in your .env file}
      Seed__AdminEmail: ${Seed__AdminEmail:-admin@quizzy.local}
      Seed__AdminPassword: ${Seed__AdminPassword:-}
    ports:
      - "${API_PORT:-8081}:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizzy-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  rabbitmq-data:
